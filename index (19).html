<!doctype html>
<html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Detektívna kancelária Šifra</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{--bg:#0a0e16;--bg2:#0f1522;--panel:rgba(255,255,255,.045);--panel2:rgba(255,255,255,.075);--line:rgba(255,255,255,.1);--txt:#eef2f8;--mut:#97a4ba;--acc:#ffb020;--acc2:#ff8a00;--cy:#38e1d6;--ok:#34d399;--bad:#fb7185;--paper:#f3e8cc;--ink:#2b2318;--r:22px;--fd:'Space Grotesk',system-ui,sans-serif;--fm:'JetBrains Mono',ui-monospace,monospace;--sh:0 12px 32px rgba(0,0,0,.35)}
body.junior{--bg:#fff7ea;--bg2:#fff1da;--panel:#fff;--panel2:#fff6e8;--line:rgba(90,55,10,.12);--txt:#2d2340;--mut:#76688a;--acc:#ff7a1a;--acc2:#ff4f3a;--cy:#0ea5a0;--ok:#059669;--bad:#e11d48;--fd:'Fredoka',system-ui,sans-serif;--sh:0 6px 0 rgba(255,140,40,.16),0 14px 28px rgba(90,50,0,.08)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--txt);font:17px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 520px at 5% -10%,rgba(255,176,32,.13),transparent 60%),radial-gradient(700px 520px at 105% 105%,rgba(56,225,214,.11),transparent 60%),linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px) 0 0/100% 34px,linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px) 0 0/34px 100%}
body.junior:before{background:radial-gradient(520px 380px at 0 0,#ffd9a8,transparent 65%),radial-gradient(480px 380px at 100% 25%,#c6f1e8,transparent 65%),radial-gradient(520px 420px at 25% 105%,#ffd3e2,transparent 65%)}
h1,h2,h3{font-family:var(--fd);letter-spacing:-.015em}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ico{width:20px;height:20px;vertical-align:-4px;flex:none}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:0;color:inherit;padding:0;text-align:left}
.brand svg{width:40px;height:40px;flex:none}
.brand b{display:block;font-family:var(--fm);font-size:19px;letter-spacing:.3em;color:var(--acc);line-height:1.1}
.brand small{display:block;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.ib{width:44px;height:44px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:14px}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 96px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:16px 0;box-shadow:var(--sh)}
.btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a1206;border:0;border-radius:999px;padding:12px 20px;font-weight:700;font-family:var(--fd);box-shadow:0 6px 20px color-mix(in srgb,var(--acc) 35%,transparent);transition:transform .12s}
body.junior .btn:not(.ghost){color:#fff}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--panel);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.btn.sm{padding:8px 14px;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inp{flex:1;min-width:0;padding:12px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg2);color:var(--txt);font:600 18px var(--fm);letter-spacing:.12em;text-transform:uppercase;outline:none}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 20%,transparent)}
.fb{margin-top:12px}.fb:empty{display:none}
.fb.ok,.fb.bad{padding:10px 14px;border-radius:14px;font-weight:600}
.fb.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.fb.bad{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.mut{color:var(--mut);font-size:15px}
.eyebrow{display:block;font-family:var(--fm);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--acc)}
.chip{display:inline-flex;font-size:13px;padding:5px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--mut)}
.hero{padding:0;overflow:hidden}.hero .scene{display:block;width:100%;height:auto}
.hero .in{padding:16px 20px 22px}
.hero h2{font-size:clamp(28px,7vw,44px);line-height:1.02;margin:8px 0 10px}.hero h2 em{font-style:normal;color:var(--acc)}
.rain line{stroke:#a9bdff;stroke-opacity:.35;stroke-width:1.2;animation:rain .7s linear infinite}
@keyframes rain{from{transform:translate(6px,-30px)}to{transform:translate(-8px,40px)}}
.win{animation:fl 6s infinite}@keyframes fl{0%,92%,100%{opacity:1}95%{opacity:.25}}
.sec{display:flex;align-items:baseline;gap:10px;margin:30px 2px 12px}
.sec .num{font-family:var(--fm);color:var(--acc);font-size:14px}.sec h3{margin:0;font-size:21px}
.levels{display:grid;gap:10px}@media(min-width:640px){.levels{grid-template-columns:repeat(3,1fr)}}
.lv{position:relative;display:flex;align-items:center;gap:12px;text-align:left;background:var(--panel);border:1.5px solid var(--line);color:var(--txt);border-radius:var(--r);padding:12px;box-shadow:var(--sh);transition:.18s}
.lv .av{width:60px;height:60px;flex:none;border-radius:18px}
.lv b{display:block;font-family:var(--fd);font-size:18px;line-height:1.2}.lv span{font-size:13px;color:var(--mut)}
.lv.on{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 22%,transparent),var(--sh)}
.lv.on:after{content:"✓";position:absolute;top:8px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#1a1206;font-size:13px;font-weight:800;display:grid;place-items:center}
.board{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:26px 14px;padding:30px 14px 20px;border-radius:24px;background:#2b2018 radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.5px) 0 0/13px 13px;box-shadow:inset 0 0 0 7px #3d2c1f,inset 0 0 50px rgba(0,0,0,.6),var(--sh)}
body.junior .board{background:#dcab70 radial-gradient(rgba(120,70,20,.28) 1px,transparent 1.7px) 0 0/10px 10px;box-shadow:inset 0 0 0 8px #b57d40,var(--sh)}
@media(min-width:640px){.board{grid-template-columns:repeat(3,1fr)}}
.strings{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.file{position:relative;z-index:1;display:flex;flex-direction:column;gap:3px;background:var(--paper);color:var(--ink);border:0;border-radius:3px;padding:22px 12px 14px;text-align:left;min-height:150px;box-shadow:0 12px 18px rgba(0,0,0,.35);transition:transform .2s}
.file:nth-child(odd){transform:rotate(-1.4deg)}.file:nth-child(even){transform:rotate(1.2deg)}
.file:not(.lock):hover{transform:translateY(-3px) scale(1.02)}
body.junior .file:nth-child(4n+1){background:#fff3a6}body.junior .file:nth-child(4n+2){background:#ffd6e5}body.junior .file:nth-child(4n+3){background:#c9ecff}body.junior .file:nth-child(4n){background:#d4f5c9}
.pin{position:absolute;top:-8px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9a9a,#d21f1f 55%,#7a0e0e);box-shadow:0 4px 5px rgba(0,0,0,.45)}
.fhead{display:flex;justify-content:space-between;align-items:center}
.file .no{font-family:var(--fm);font-size:11px;letter-spacing:.2em;opacity:.6}
.file .ico{width:24px;height:24px;opacity:.7}
.file b{font-family:var(--fd);font-size:19px;line-height:1.12;margin-top:6px}
.file .desc{font-size:13px;opacity:.72;line-height:1.3;margin-bottom:8px}
.bar{height:7px;border-radius:9px;background:rgba(0,0,0,.12);overflow:hidden;margin-top:auto}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#16a34a,#4ade80)}
.file.lock{cursor:default}.file.lock>:not(.tape):not(.pin){opacity:.42}
.tape{position:absolute;right:-6px;bottom:16px;transform:rotate(-10deg);font:700 11px var(--fm);letter-spacing:.16em;color:#111;padding:4px 14px;background:repeating-linear-gradient(-45deg,#facc15 0 9px,#fde68a 9px 18px);box-shadow:0 2px 4px rgba(0,0,0,.3)}
.file .st{position:absolute;right:8px;top:24px;font:700 11px var(--fm);color:#b91c1c;border:2px solid #b91c1c;border-radius:6px;padding:1px 6px;transform:rotate(10deg)}
.casehead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 2px 0}
.casehead h2{margin:4px 0 0;font-size:clamp(28px,7vw,38px);line-height:1.05}
.ring{width:66px;height:66px;flex:none}.ring text{font:700 13px var(--fm);fill:var(--txt)}
.guide{display:flex;gap:14px;align-items:flex-start}
.guide .av{width:76px;height:76px;flex:none;border-radius:22px;box-shadow:var(--sh)}
.bubble{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:4px 20px 20px 20px;padding:12px 15px}
.who{display:block;font:700 14px var(--fd);color:var(--acc);margin-bottom:2px}
.say{margin-top:10px}
.t{border-bottom:2px dotted var(--cy);cursor:help;font-weight:600}
.tasknav{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;margin:6px -2px 0;scrollbar-width:none}
.tasknav button{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:999px;padding:6px 14px 6px 6px;font-size:14px;font-weight:600}
.tasknav .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font:700 12px var(--fm)}
.tasknav button.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.tasknav button.on .n{background:var(--acc);color:#1a1206}.tasknav button.ok .n{background:var(--ok);color:#fff}
.task h3{margin:4px 0 8px;font-size:23px}
.task .done{display:inline-block;color:var(--ok);font-size:13px;font-weight:700;margin-bottom:4px}
.qcard{border:1px solid var(--line);border-radius:18px;padding:4px 14px 12px;margin:12px 0}
.big{font-family:var(--fm);font-size:30px;font-weight:700;letter-spacing:.28em;text-align:center;padding:16px 10px;margin:12px 0;background:var(--bg2);border:1.5px dashed color-mix(in srgb,var(--acc) 50%,transparent);border-radius:18px;word-break:break-word;color:var(--acc)}
body.junior .big{background:#fff;color:var(--txt)}
.key{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.key span{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:4px 9px;font:500 14px var(--fm)}
.slots{display:flex;gap:6px;justify-content:center;margin:14px 0;flex-wrap:wrap}
.slot{width:46px;height:54px;border-radius:14px;background:var(--panel2);border:2px dashed var(--line);display:grid;place-items:center;font:700 26px var(--fd)}
.slot:not(:empty){border:2px solid var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.tiles{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:10px 0}
.tile{width:58px;height:58px;border-radius:16px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font:700 24px var(--fd);box-shadow:0 5px 0 var(--line);transition:transform .08s}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
body.junior .tile{background:#fff;box-shadow:0 5px 0 #f5d1a3}
.grid{display:grid;gap:3px;margin:14px auto;max-width:460px;padding:12px;background:var(--paper);border-radius:16px;box-shadow:var(--sh)}
.grid .lab{font:600 13px var(--fm);color:#7a6644;padding-right:8px;display:flex;align-items:center;justify-content:flex-end;white-space:nowrap}
.grid .c{aspect-ratio:1;border:1px solid #dccca4;background:#fffaf0;border-radius:4px;padding:0;transition:background .1s}
.grid .c.on{background:#1f1a2e;border-color:#1f1a2e}
.strip{overflow-x:auto;font:500 15px var(--fm);background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin:12px 0}
.strip div{white-space:nowrap;letter-spacing:.35em}.strip .hi{color:var(--acc)}
input[type=range]{width:100%;accent-color:var(--acc);height:30px}
label{display:block;margin-top:8px;font-weight:600}
.bits{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.bit{width:58px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--mut);padding:8px 0;text-align:center;font:600 12px var(--fm);box-shadow:0 4px 0 var(--line)}
.bit b{display:block;font-size:26px;color:var(--txt)}
.bit.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a1206;border-color:transparent}.bit.on b{color:#1a1206}
.sw{height:96px;border-radius:18px;border:1px solid var(--line);flex:1}
.bars{display:flex;gap:2px;align-items:flex-end;height:80px;margin:10px 0 22px}
.bars div{flex:1;background:linear-gradient(var(--cy),color-mix(in srgb,var(--cy) 50%,transparent));border-radius:4px 4px 0 0;position:relative;min-width:8px}
.bars span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font:500 10px var(--fm);color:var(--mut)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:13px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--panel2);color:var(--txt);font-weight:500;transition:.15s}
.opt:hover{border-color:color-mix(in srgb,var(--acc) 55%,var(--line))}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.closed{text-align:center;padding:24px 10px 6px}
.stamp{display:inline-block;color:#e11d48;border:4px double #e11d48;border-radius:12px;padding:6px 18px;font:700 22px var(--fm);letter-spacing:.2em;transform:rotate(-8deg);animation:stamp .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.6);opacity:0}}
.sheet{position:fixed;inset:auto 0 0 0;z-index:50;background:var(--bg2);border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:12px 20px 30px;max-height:72vh;overflow:auto;box-shadow:0 -14px 50px rgba(0,0,0,.5);transform:translateY(110%);transition:.28s;visibility:hidden}
.sheet:before{content:"";display:block;width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet.show{transform:none;visibility:visible}.sheet h3{margin:0 0 6px;color:var(--acc);font-size:22px}
.gl dt{font:700 16px var(--fd);margin-top:12px}.gl dd{margin:0;color:var(--mut)}
#intro{position:fixed;inset:0;z-index:60;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px),radial-gradient(circle at 50% 40%,#1a2340,#05080e 70%);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#intro.show{display:flex}
#intro .inum{font:700 110px/1 var(--fm);color:transparent;-webkit-text-stroke:2px rgba(255,176,32,.55);animation:ia 1s both}
#intro .ln{font:700 clamp(18px,5.6vw,40px) var(--fm);white-space:nowrap;margin:4px 0;opacity:0;letter-spacing:.15em}
#intro .a1{animation:ia .8s .4s forwards}#intro .a2{animation:ia .8s 1.6s forwards;color:#ffb020}#intro .a3{animation:ia .8s 2.8s forwards;color:#38e1d6}
@keyframes ia{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
#intro p{max-width:520px;color:#c3cde0;opacity:0;animation:ia .8s 3.8s forwards}
@media(prefers-reduced-motion:reduce){*{animation:none!important}#intro *{opacity:1!important}}
.doc{background:#fffdf7;color:#1f2937;border-radius:8px;padding:16px 18px;box-shadow:0 10px 24px rgba(0,0,0,.22);font:17px/1.75 Georgia,'Times New Roman',serif;margin:12px 0;white-space:pre-wrap;word-break:break-word}
.doc .wd{cursor:pointer;border-radius:4px;padding:1px 2px}.doc .wd:hover{background:#fde68a}.doc .wd.fixed{background:#bbf7d0}
.doc mark{background:#fde047;border-radius:3px}.hc{color:#0e9f9a;cursor:pointer;font:700 15px var(--fm);padding:0 2px;border-radius:4px}.hc:hover{background:#ccfbf1}
.blk{display:block;width:100%;text-align:left;padding:8px 10px;margin:3px 0;border-radius:8px;border:2px solid transparent;background:none;font:inherit;color:inherit}.blk.sel{border-color:#f59e0b;background:#fef3c7}
.tb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;margin:10px 0;background:var(--bg2);border:1px solid var(--line);border-radius:16px}.tb.col{flex-direction:column;align-items:stretch}
.tbtn{min-width:42px;height:42px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tbtn.on{background:var(--acc);color:#1a1206;border-color:transparent}
.sep{width:1px;height:26px;background:var(--line);margin:0 2px}.dot{width:20px;height:20px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.chk{display:inline-flex;align-items:center;gap:6px;margin:4px 8px 0 4px;font-weight:600;font-size:15px}.chk input{width:20px;height:20px;accent-color:var(--acc)}
.page{position:relative;margin:14px auto;background:#fff;border-radius:3px;box-shadow:0 10px 24px rgba(0,0,0,.3);transition:width .3s,height .3s;overflow:hidden}
.page .mg{position:absolute;top:0;bottom:0;left:0;background:repeating-linear-gradient(45deg,#fecaca 0 4px,#fff 4px 8px);transition:width .3s}
.page .ln2{position:absolute;top:14px;right:10px;bottom:14px;background:repeating-linear-gradient(#cbd5e1 0 3px,transparent 3px 11px);transition:left .3s}
.qrow{padding:10px 0;border-bottom:1px solid var(--line)}
.tile.wide{width:auto;padding:0 14px;font-size:19px}.slot.wide{width:auto;min-width:56px;padding:0 10px;font-size:18px}
.typ{font:500 19px/1.9 var(--fm);background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:10px 0;word-break:break-word}
.tw{white-space:nowrap}.tc{color:var(--mut)}.tc.ok{color:var(--ok)}.tc.bad{color:#fff;background:var(--bad);border-radius:3px}.tc.cur{color:var(--txt);border-bottom:3px solid var(--acc)}
.inp.tin{width:100%;text-transform:none;letter-spacing:0;border-radius:16px;font:500 18px var(--fm);resize:vertical}
.inp.sel{flex:0 0 150px;text-transform:none;letter-spacing:0;font-size:15px;border-radius:12px}
.qline{font:600 19px var(--fd);margin:10px 0}
.kb{background:var(--bg2);border:1px solid var(--line);padding:8px 6px;border-radius:16px;margin:12px 0}
.kr{display:flex;gap:4px;justify-content:center;margin:5px 0}
.kk{flex:1 1 0;max-width:40px;height:46px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font:600 16px var(--fm);box-shadow:0 3px 0 var(--line);padding:0}
body.junior .kk{background:#fff}.kk.wide{max-width:none;flex:1.8 1 0;font-size:12px}.kk.space{flex:6 1 0}.kk.hit{background:var(--ok)!important;color:#fff}
.sheetw{overflow-x:auto;margin:12px 0;border-radius:12px;border:1px solid var(--line);box-shadow:var(--sh)}
table.xs{border-collapse:collapse;font:500 14px var(--fm);background:#fff;color:#1f2937;min-width:100%}
.xs th{background:#eef2f7;color:#64748b;font-weight:600;padding:5px 8px;border:1px solid #dbe2ea;font-size:12px;white-space:nowrap}
.xs td{border:1px solid #e2e8f0;padding:6px 7px;min-width:44px;height:38px;white-space:nowrap}
.xs td.ed{background:#fffbeb}.xs td.sel{outline:2.5px solid #16a34a;outline-offset:-2px}.xs td.err{color:#dc2626}
.xs tr.pick{cursor:pointer}.xs tr.pick:hover td{background:#fef9c3}.xs tr.hit td,.xs td.hit{background:#bbf7d0!important}
.grid2 td{text-align:center;font-size:24px;width:52px;cursor:pointer}.grid2 td:hover{background:#fef9c3}
.fbar{display:flex;gap:6px;align-items:center;margin-top:10px}.fbar .ad{font:700 14px var(--fm);min-width:48px;text-align:center;padding:10px 6px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}

function ask(box,correct,{hint,ph='Napíš riešenie',ok}={}){
 const inp=el('input',{class:'inp',placeholder:ph,autocomplete:'off',autocapitalize:'characters',spellcheck:'false'});
 const fb=el('div',{class:'fb'});let tries=0;
 const go=()=>{if(!inp.value.trim())return;if(norm(inp.value)===norm(correct)){fb.className='fb ok';fb.textContent='✔ Správne!';beep(1);ok&&ok(fb)}
  else{tries++;fb.className='fb bad';fb.innerHTML='✘ Ešte nie. '+(hint?'<br><b>Stopa:</b> '+hint:'');beep(0);
   if(tries>=3)fb.append(' ',el('button',{class:'btn sm ghost',onclick:()=>fb.innerHTML=`Riešenie: <b>${correct}</b>. Vyskúšaj si potom nový prípad.`},'Ukáž riešenie'))}};
 inp.onkeydown=e=>{if(e.key=='Enter')go()};
 box.append(el('div',{class:'row'},inp,el('button',{class:'btn',onclick:go},'Overiť')),fb);
}
function tiles(box,items,correct,ok){
 let cur=[];const out=el('div',{class:'slots'}),fb=el('div',{class:'fb'});
 const draw=()=>{out.innerHTML='';correct.forEach((_,i)=>out.append(el('span',{class:'slot'+(items.some(x=>x.l.length>2)?' wide':'')},cur[i]?cur[i].l:'')))};
 const check=()=>{if(cur.map(c=>c.v).join('|')===correct.join('|')){fb.className='fb ok';fb.textContent='✔ Výborne!';beep(1);ok&&ok(fb)}else{fb.className='fb bad';fb.textContent='✘ Niečo nesedí. Skús znova.';beep(0);setTimeout(()=>{cur=[];draw()},900)}};
 box.append(out,el('div',{class:'tiles'},shuffle(items).map(it=>el('button',{class:'tile'+(it.l.length>2?' wide':''),onclick:()=>{if(cur.length<correct.length){cur.push(it);draw();fb.textContent='';if(cur.length==correct.length)check()}}},it.l))),
  el('div',{class:'row',style:'justify-content:center'},el('button',{class:'btn sm ghost',onclick:()=>{cur.pop();draw()}},'⌫ Späť')),fb);draw();
}
function grid(box,pat,lab,ok){
 const m=pat[0].length;let st=pat.map(r=>[...r].map(()=>0));
 const g=el('div',{class:'grid',style:`grid-template-columns:auto repeat(${m},1fr)`});
 pat.forEach((r,i)=>{g.append(el('div',{class:'lab'},lab(r)));[...r].forEach((_,j)=>{const c=el('button',{class:'c','aria-label':`riadok ${i+1}, stĺpec ${j+1}`,onclick:()=>{st[i][j]^=1;c.classList.toggle('on')}});g.append(c)})});
 const fb=el('div',{class:'fb'});
 box.append(g,el('div',{class:'row',style:'justify-content:center'},el('button',{class:'btn',onclick:()=>{const bad=pat.reduce((s,r,i)=>s+[...r].filter((v,j)=>+v!==st[i][j]).length,0);
  if(!bad){fb.className='fb ok';fb.textContent='✔ Obrázok je presne podľa kódu!';beep(1);ok&&ok(fb)}else{fb.className='fb bad';fb.textContent=`✘ Nesedí ešte ${bad} ${bad==1?'políčko':bad<5?'políčka':'políčok'}. Skontroluj riadok po riadku.`;beep(0)}}},'Skontrolovať')),fb);
}
function mc(box,q,ok){
 const opts=shuffle([q.a,...q.w]);const fb=el('div',{class:'fb'});let done=false;
 box.append(el('p',{html:'<b>'+q.q+'</b>'}),...opts.map(o=>{const b=el('button',{class:'opt',onclick:()=>{if(done)return;if(o===q.a){b.classList.add('ok');done=true;fb.className='fb ok';fb.innerHTML='✔ '+(q.e||'Správne.');beep(1);ok&&ok()}else{b.classList.add('bad');fb.className='fb bad';fb.textContent='✘ Skús inú možnosť.';beep(0)}}},o);return b}),fb);
}
